<!DOCTYPE html>
<html lang="zh-HK" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boardgame Narrator — 主頁</title>
    <style>
        :root[data-theme="dark"] {
            --bg: #0f1724;
            --card-bg: #111827;
            --text: #e6eef8;
            --subtext: #9aa7bf;
            --small-text: #94a3b8;
            --shadow: rgba(2,6,23,0.7);
        }
        :root[data-theme="light"] {
            --bg: #f0f4f8;
            --card-bg: #ffffff;
            --text: #1a202c;
            --subtext: #4a5568;
            --small-text: #718096;
            --shadow: rgba(0,0,0,0.15);
        }
        body { font-family: -apple-system, "Microsoft JhengHei", "微軟正黑體", sans-serif; background: var(--bg); color: var(--text); display:flex; align-items:center; justify-content:center; height:100vh; margin:0; transition: background 0.3s, color 0.3s; }
        .card { background: var(--card-bg); padding:30px; border-radius:12px; box-shadow:0 8px 30px var(--shadow); text-align:center; width:90%; max-width:480px; position: relative; }
        h1 { margin:0 0 12px 0; color:#7dd3fc; }
        p { color: var(--subtext); margin:0 0 20px 0; }
        a { text-decoration:none; }
        .btn { display:inline-block; padding:14px 22px; border-radius:10px; font-weight:700; background:#ff6b6b; color:white; border:none; cursor:pointer; font-size:1rem; }
        .btn:active{ transform:translateY(1px); }
        .small { margin-top:12px; color: var(--small-text); font-size:0.88rem; }
        .theme-toggle {
            position: absolute;
            top: 14px;
            right: 14px;
            background: transparent;
            border: 1px solid var(--small-text);
            color: var(--text);
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 0.8rem;
            cursor: pointer;
        }
        .theme-toggle:hover { opacity: 0.8; }
    </style>
</head>
<body>
    <div class="card">
        <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">☀️ 淺色</button>
        <h1>Boardgame Narrator</h1>
        <p>歡迎！選擇下方工具以開始。</p>
        <a href="avalon.html"><button class="btn">開啟 阿瓦隆遊戲助手</button></a>
        <div class="small">或把此頁設為專案入口。</div>
    </div>
    <script>
        const html = document.documentElement;
        const btn = document.getElementById('themeBtn');

        function applyTheme(theme) {
            html.setAttribute('data-theme', theme);
            btn.textContent = theme === 'dark' ? '☀️ 淺色' : '🌙 深色';
            localStorage.setItem('theme', theme);
        }

        function toggleTheme() {
            applyTheme(html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
        }

        // Load saved preference on page load
        const saved = localStorage.getItem('theme');
        if (saved) applyTheme(saved);
    </script>
</body>
</html>
